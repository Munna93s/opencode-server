name: OpenCode Cloud Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://cloudflare.com | sudo tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://cloudflare.com any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg python3-pip cloudflared
          sudo npm install -g opencode-ai

      - name: Start Server & Send Link
        env:
          OPENCODE_SERVER_PASSWORD: ${{ secrets.SERVER_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          nohup opencode serve --port 4096 --hostname 0.0.0.0 > /tmp/opencode.log 2>&1 &
          sleep 5
          nohup cloudflared tunnel --url http://localhost:4096 > /tmp/cf.log 2>&1 &
          
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            curl -s -d "OpenCode URL: $TUNNEL_URL" "https://ntfy.sh" > /dev/null
            echo "Done! Link sent to ntfy."
          else
            cat /tmp/cf.log
            exit 1
          fi

          sleep 19800
          
