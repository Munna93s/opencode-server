name: OpenCode Cloud Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg python3-pip
          sudo npm install -g opencode-ai cloudflared

      - name: Start Server & Show Link
        env:
          OPENCODE_SERVER_PASSWORD: ${{ secrets.SERVER_PASS }}
        run: |
          nohup opencode serve --port 4096 --hostname 0.0.0.0 > /tmp/opencode.log 2>&1 &
          sleep 5
          nohup cloudflared tunnel --url http://localhost:4096 > /tmp/cf.log 2>&1 &
          
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "=========================================="
            echo "YOUR OPENCODE LINK: $TUNNEL_URL"
            echo "=========================================="
          else
            cat /tmp/cf.log
            exit 1
          fi

          sleep 19800
          
